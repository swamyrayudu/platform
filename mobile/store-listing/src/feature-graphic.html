<!doctype html>
<html><head><meta charset="utf-8">
<style>

html,body { margin:0; padding:0; }
body { width:1024px; height:500px; overflow:hidden; background:#2E2B55; font-family: Manrope, "Segoe UI", sans-serif; color:#FFFEFB; position:relative; }
.glow { position:absolute; right:-120px; top:-160px; width:620px; height:620px; border-radius:50%;

h1 { margin:0; font-size:54px; line-height:1.08; font-weight:700; letter-spacing:-1px; }
h1 em { font-style:normal; color:#C9A15E; }
p { margin:22px 0 0; font-size:22px; line-height:1.4; color:rgba(255,254,251,.78); font-weight:700; }
.chips { display:flex; gap:10px; margin-top:28px; }
.chip { padding:8px 16px; border-radius:999px; background:rgba(255,254,251,.1); border:1px solid rgba(255,254,251,.18); font-size:16px; font-weight:700; }
.art { position:absolute; right:92px; top:50%; transform:translateY(-50%); width:300px; height:300px; }
